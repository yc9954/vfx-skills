[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vfx-skills"
version = "0.1.0"
description = "Reference-led VFX skills, deterministic project routing and guarded generation jobs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vfx = "vfx_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
