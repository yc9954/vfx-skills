<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
  <title id="title">VFX Skills — Reference to performance to production</title>
  <desc id="desc">A documentation illustration of three production paths: Blender, Higgsfield, and Hybrid, with separate visual review and technical delivery.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1c2b"/><stop offset="1" stop-color="#111318"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#294b53" stop-opacity=".5"/><stop offset="1" stop-color="#294b53" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#75939c" stroke-opacity=".075"/></pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#8fa3b0"/></marker>
  </defs>
  <rect width="1600" height="580" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="580" rx="24" fill="url(#grid)"/>
  <ellipse cx="1130" cy="275" rx="490" ry="325" fill="url(#glow)"/>
  <rect x="24" y="24" width="1552" height="532" rx="16" fill="none" stroke="#c9ab70" stroke-opacity=".25"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <path d="M72 88h26m-13-13v26" stroke="#d1b57d" stroke-width="2"/>
    <text x="113" y="94" fill="#d1b57d" font-size="14" letter-spacing="3">REFERENCE-LED PRODUCTION</text>
    <text x="72" y="228" fill="#f2eee6" font-size="110" font-weight="700" letter-spacing="-5">VFX Skills</text>
    <text x="78" y="291" fill="#b5c7d0" font-size="26">Small worlds. Believable performances.</text>
    <text x="78" y="346" fill="#8296a5" font-size="17">A skill system for intentional animation,</text>
    <text x="78" y="374" fill="#8296a5" font-size="17">guarded generation, and evidence-based delivery.</text>
    <line x1="78" y1="424" x2="659" y2="424" stroke="#364450"/>
    <text x="78" y="466" fill="#eee5d4" font-size="28" font-weight="600">11</text>
    <text x="123" y="466" fill="#8fa3b0" font-size="14">SPECIALIST SKILLS</text>
    <text x="320" y="466" fill="#eee5d4" font-size="28" font-weight="600">3</text>
    <text x="352" y="466" fill="#8fa3b0" font-size="14">PRODUCTION PATHS</text>
    <text x="805" y="94" fill="#8fa3b0" font-size="13" letter-spacing="2">SYSTEM MAP / DOCUMENTATION</text>
    <rect x="805" y="132" width="698" height="68" rx="12" fill="#1a2936" stroke="#45535e"/>
    <text x="831" y="159" fill="#d1b57d" font-size="12" letter-spacing="2">START WITH INTENT</text>
    <text x="831" y="184" fill="#e7ecee" font-size="18">Current brief + approved references + existing state</text>
    <path d="M1154 200v31H912v24M1154 231v24M1154 231h242v24" fill="none" stroke="#8fa3b0" stroke-width="1.5"/>
    <g fill="#15232e" stroke="#495967"><rect x="805" y="255" width="215" height="117" rx="12"/><rect x="1047" y="255" width="215" height="117" rx="12"/><rect x="1289" y="255" width="214" height="117" rx="12"/></g>
    <g fill="#f2eee6" font-size="23" font-weight="600"><text x="825" y="300">Blender</text><text x="1067" y="300">Higgsfield</text><text x="1309" y="300">Hybrid</text></g>
    <g fill="#a4b8c3" font-size="15"><text x="825" y="329">Rig / contact / render</text><text x="1067" y="329">Reference / generate</text><text x="1309" y="329">Guide + expression</text></g>
    <g fill="#66b6ad"><circle cx="829" cy="351" r="3"/><circle cx="1071" cy="351" r="3"/><circle cx="1313" cy="351" r="3"/></g>
    <path d="M912 372v28h242m242-28v28h-242m0-28v68" fill="none" stroke="#8fa3b0" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="805" y="448" width="698" height="59" rx="12" fill="#232c2e" stroke="#b89c67"/>
    <text x="831" y="484" fill="#e7dbc3" font-size="19">Visual + physical review</text>
    <path d="M1109 478h44" stroke="#b89c67" marker-end="url(#arrow)"/>
    <text x="1171" y="484" fill="#e7dbc3" font-size="19">Technical delivery</text>
  </g>
